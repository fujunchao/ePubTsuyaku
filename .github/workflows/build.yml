name: Build Windows Desktop

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows desktop app
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Run unit tests
        run: python -m unittest discover -s tests -q

      - name: Build backend sidecar (PyInstaller)
        run: pyinstaller ePubTsuyaku-backend.spec --noconfirm --distpath dist-backend --workpath build-backend

      - name: Smoke test backend sidecar
        run: |
          $exe = Join-Path (Get-Location) "dist-backend/ePubTsuyaku-backend.exe"
          if (-not (Test-Path $exe)) { throw "backend exe not found: $exe" }
          $port = 18117
          $proc = Start-Process -FilePath $exe -ArgumentList "--port", "$port" -PassThru -WindowStyle Hidden
          $healthy = $false
          try {
            for ($i = 0; $i -lt 60; $i++) {
              Start-Sleep -Seconds 2
              try {
                $resp = Invoke-WebRequest -Uri "http://127.0.0.1:$port/api/status" -UseBasicParsing -TimeoutSec 3
                if ($resp.StatusCode -eq 200) { $healthy = $true; break }
              } catch { }
            }
          } finally {
            if ($proc -and -not $proc.HasExited) {
              taskkill /PID $proc.Id /T /F | Out-Null
            }
          }
          if (-not $healthy) { throw "backend smoke test failed: /api/status never returned 200" }
          Write-Host "backend smoke test passed"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build Electron app (NSIS installer + portable zip)
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npm install --no-audit --no-fund
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $version = $env:GITHUB_REF_NAME -replace "^v", ""
            npm run dist -- --config.extraMetadata.version=$version
          } else {
            npm run dist
          }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ePubTsuyaku-windows-x64
          path: |
            desktop/release/*.exe
            desktop/release/*.zip
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/release/*.exe
            desktop/release/*.zip
          generate_release_notes: true
